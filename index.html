<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>Celea Accessories - Space 3D Responsive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo&display=swap');

    body {
        margin: 0;
        height: 100vh;
        font-family: 'Cairo', Arial, sans-serif;
        overflow: hidden;
        direction: rtl;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1000px;
    }

    canvas#stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
    }

    .container-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 15px;
    }

    .container {
        background: rgba(255, 255, 255, 0.1);
        width: 100%;
        max-width: 360px;
        text-align: center;
        border-radius: 25px;
        padding: 30px 20px;
        box-shadow:
            8px 8px 20px rgba(0,0,0,0.5),
            -8px -8px 20px rgba(255,255,255,0.1);
        transform-style: preserve-3d;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .container:hover {
        transform: rotateY(10deg) rotateX(10deg);
        box-shadow:
            12px 12px 25px rgba(0,0,0,0.6),
            -12px -12px 25px rgba(255,255,255,0.2);
    }

    .logo {
        width: 140px;
        max-width: 35vw;
        margin-bottom: 20px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        transition: transform 0.3s ease;
    }

    .container:hover .logo {
        transform: scale(1.05) translateZ(30px);
    }

    h1 {
        font-size: 2rem;
        margin: 10px 0;
        color: #fff;
        text-shadow: 0 1px 5px rgba(0,0,0,0.5);
    }

    p {
        font-size: 1rem;
        color: #ccc;
        margin-bottom: 30px;
        letter-spacing: 0.03em;
    }

    .btn {
        display: block;
        padding: 14px;
        margin: 12px 0;
        border-radius: 30px;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 700;
        color: white;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn:hover {
        filter: brightness(1.1);
        transform: translateY(-4px) translateZ(15px);
        box-shadow: 0 12px 25px rgba(0,0,0,0.5);
    }

    .whatsapp {
        background-color: #128C7E;
    }

    .instagram {
        background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
    }

    .tiktok {
        background-color: #000;
    }

    /* كود لون الفيسبوك الجديد */
    .facebook {
        background-color: #3086f5;
    }

    @media (max-width: 500px) {
        .container {
            padding: 20px 15px;
        }
        h1 {
            font-size: 1.5rem;
        }
        p {
            font-size: 0.9rem;
        }
        .btn {
            font-size: 0.9rem;
            padding: 12px;
        }
        .logo {
            max-width: 50vw;
        }
    }
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="container-wrapper">
    <div class="container">
        <img src="photo/WhatsApp%20Image%202025-11-23%20at%2016.33.03_74635731.jpg" class="logo" alt="Logo" />
        <h1>Celea_accessories 🎀</h1>
        <p>Accessories • Gifts • Trendy</p>

        <a href="https://chat.whatsapp.com/CDO2b8BPlGd3Xk5MFHGHPd?mode=wwt" target="_blank" class="btn whatsapp">
            Join WhatsApp
        </a>

        <a href="https://www.instagram.com/celea_accessories?igsh=MW04bHJldWF2NWY5bQ==" target="_blank" class="btn instagram">
            Instagram
        </a>

        <a href="https://www.tiktok.com/@celea_accessories?_r=1&_t=ZS-91dpZSlZUOd" target="_blank" class="btn tiktok">
            TikTok
        </a>

        <!-- زر الفيسبوك الجديد -->
        <a href="https://www.facebook.com/share/1Dtm8e5vsY/?mibextid=wwXIfr" target="_blank" class="btn facebook">
            Facebook
        </a>
    </div>
</div>

<script>
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
let stars = [];

function initStars() {
    stars = [];
    for (let i = 0; i < 500; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            z: Math.random() * width,
            o: Math.random()
        });
    }
}

function moveStars() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, width, height);
    for (let i = 0; i < stars.length; i++) {
        let s = stars[i];
        s.z -= 2;
        if (s.z <= 0) s.z = width;
        let k = 128.0 / s.z;
        let px = s.x * k + width/2;
        let py = s.y * k + height/2;
        if(px >= 0 && px <= width && py >=0 && py <= height){
            let size = (1 - s.z/width)*3;
            ctx.fillStyle = `rgba(255,255,255,${s.o})`;
            ctx.beginPath();
            ctx.arc(px, py, size, 0, Math.PI*2);
            ctx.fill();
        }
    }
    requestAnimationFrame(moveStars);
}

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initStars();
});

initStars();
moveStars();
</script>

</body>
</html>
